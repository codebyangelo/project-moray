name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Clang & Build Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm gcc make libbpf-dev gcc-multilib linux-libc-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff

    - name: Run Comprehensive Verification Pipeline
      run: |
        make verify
