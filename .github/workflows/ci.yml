name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Hermetic Verification & Mock Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Clang & Build Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm gcc make libbpf-dev gcc-multilib linux-libc-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff

    - name: Run Comprehensive Verification Pipeline
      run: |
        make verify

  live-kernel-kvm:
    name: Live Ring 0 Kernel Verification (KVM)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Toolchain, QEMU & virtme-ng
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm gcc make libbpf-dev gcc-multilib linux-libc-dev qemu-system-x86
        sudo pip install --break-system-packages virtme-ng

    - name: Verify KVM Virtualization Acceleration & Kernel Permissions
      run: |
        if [ -e /dev/kvm ]; then
          echo "[+] KVM acceleration available on runner"
          sudo chmod 666 /dev/kvm
        else
          echo "[!] Warning: /dev/kvm not found; virtme-ng will use emulation"
        fi
        sudo chmod +r /boot/vmlinuz-* || true

    - name: Build BPF Bytecode & Loader Daemon
      run: |
        make build

    - name: Execute Live Ring 0 Test Suite in MicroVM
      run: |
        set -o pipefail
        vng -v \
            -r "/boot/vmlinuz-$(uname -r)" \
            --append "lsm=landlock,lockdown,yama,bpf" \
            --user root \
            --cwd "$PWD" \
            --exec "$PWD/tests/run_live_kernel_test.sh" 2>&1 | tee kvm_microvm_test.log

    - name: Enforce Ground Truth Invariant (Zero Fail-Green Gate)
      run: |
        if [ ! -f kvm_microvm_test.log ]; then
          echo "[-] FATAL: kvm_microvm_test.log was not generated!"
          exit 1
        fi
        if ! grep -q "ALL 80 LIVE RING 0 KERNEL TEST STEPS PASSED CLEANLY" kvm_microvm_test.log; then
          echo "[-] FATAL: MicroVM test failed or did not complete all 80 steps cleanly!"
          exit 1
        fi
        if grep -q "FATAL" kvm_microvm_test.log; then
          echo "[-] FATAL error detected in microvm test execution log!"
          exit 1
        fi
        echo "[+] Ground Truth Invariant Verified: All 80 steps completed without error."

    - name: Archive KVM Execution Logs & Diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kvm-microvm-verification-logs
        path: |
          kvm_microvm_test.log
          /tmp/morayd_live.log
          /tmp/morayd_relaunch.log
          /tmp/morayd_auto.log
          /tmp/morayd_deny_all.log
          /tmp/morayd_require_wan.log
          /tmp/morayd_workload.log
        if-no-files-found: ignore
